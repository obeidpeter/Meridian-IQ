# OpenAPI 3.1 fragment. Structurally merge paths and components into the parent spec.
# Existing InvoiceDetail, InvoiceImportRow, InvoiceImportResult and Error schemas are referenced.
paths:
  /operations:
    get:
      operationId: listOperations
      tags: [operations]
      summary: List the caller's authorized committed operations
      description: Own actor only; current tenant, client scope and non-archived engagement are rechecked. No running or client-asserted results are returned.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 256 }
          description: Opaque nextCursor from the preceding page.
      responses:
        "200":
          description: Committed operation summaries, newest first.
          headers:
            Cache-Control: { $ref: "#/components/headers/RecoveryCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationList" }
        "400": { $ref: "#/components/responses/RecoveryBadRequest" }
        "401": { $ref: "#/components/responses/RecoveryUnauthorized" }
        "403": { $ref: "#/components/responses/RecoveryForbidden" }
  /operations/lookup:
    get:
      operationId: lookupOperation
      tags: [operations]
      summary: Recover an authorized result by command and request key
      description: A 404 means no authorized committed result is visible, not that the command failed. Retry the original mutation with its same key and payload.
      parameters:
        - name: command
          in: query
          required: true
          schema: { $ref: "#/components/schemas/OperationCommand" }
        - name: idempotencyKey
          in: query
          required: true
          schema: { $ref: "#/components/schemas/OperationIdempotencyKey" }
      responses:
        "200":
          description: Server-verified saved command result.
          headers:
            Cache-Control: { $ref: "#/components/headers/RecoveryCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationDetail" }
        "400": { $ref: "#/components/responses/RecoveryBadRequest" }
        "401": { $ref: "#/components/responses/RecoveryUnauthorized" }
        "403": { $ref: "#/components/responses/RecoveryForbidden" }
        "404": { $ref: "#/components/responses/RecoveryNotFound" }
  /operations/{id}:
    get:
      operationId: getOperation
      tags: [operations]
      summary: Recover the caller's authorized operation result
      parameters:
        - $ref: "#/components/parameters/RecoveryId"
      responses:
        "200":
          description: Server-verified saved command result.
          headers:
            Cache-Control: { $ref: "#/components/headers/RecoveryCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationDetail" }
        "400": { $ref: "#/components/responses/RecoveryBadRequest" }
        "401": { $ref: "#/components/responses/RecoveryUnauthorized" }
        "403": { $ref: "#/components/responses/RecoveryForbidden" }
        "404": { $ref: "#/components/responses/RecoveryNotFound" }
  /invoice-import-runs:
    post:
      operationId: createInvoiceImportRun
      tags: [operations]
      summary: Create or recover an immutable resumable import manifest
      description: Persist a random client-generated id before dispatch. Reusing it with the identical manifest returns the current run; a changed manifest conflicts. Maximum 5000 rows per run. Requires invoice.write and current supplier authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRunManifest" }
      responses:
        "201": { $ref: "#/components/responses/ImportRunSuccess" }
        "200": { $ref: "#/components/responses/ImportRunSuccess" }
        "400": { $ref: "#/components/responses/RecoveryBadRequest" }
        "401": { $ref: "#/components/responses/RecoveryUnauthorized" }
        "403": { $ref: "#/components/responses/RecoveryForbidden" }
        "404": { $ref: "#/components/responses/RecoveryNotFound" }
        "409": { $ref: "#/components/responses/RecoveryConflict" }
  /invoice-import-runs/{id}:
    get:
      operationId: getInvoiceImportRun
      tags: [operations]
      summary: Read the authorized import checkpoint and committed chunk results
      description: Use after a timeout or refresh to resume from nextChunkIndex. Only the authenticated actor's currently authorized run is visible. Checkpoint and chunks are read consistently.
      parameters:
        - $ref: "#/components/parameters/RecoveryId"
      responses:
        "200": { $ref: "#/components/responses/ImportRunSuccess" }
        "400": { $ref: "#/components/responses/RecoveryBadRequest" }
        "401": { $ref: "#/components/responses/RecoveryUnauthorized" }
        "403": { $ref: "#/components/responses/RecoveryForbidden" }
        "404": { $ref: "#/components/responses/RecoveryNotFound" }
  /invoice-import-runs/{id}/chunks/{chunkIndex}:
    post:
      operationId: commitInvoiceImportChunk
      tags: [operations]
      summary: Atomically commit or replay one manifest chunk
      description: The server derives the invoice.import key as runId:chunkIndex. Future chunks are rejected until preceding chunks commit. Counts, row indexes and canonical payload hash must match the immutable manifest. A replay returns the exact original response including its original nextChunkIndex; GET the run for the latest checkpoint. Invalid rows are durable outcomes and advance the checkpoint. Chunks remain replayable after finalization.
      parameters:
        - $ref: "#/components/parameters/RecoveryId"
        - name: chunkIndex
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 4999 }
        - name: X-Idempotency-Key
          in: header
          required: false
          description: Optional; when supplied it must equal the lowercase run UUID followed by a colon and the zero-based chunk index. Never create a new key for a retry.
          schema: { $ref: "#/components/schemas/OperationIdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRunChunkInput" }
      responses:
        "200":
          description: Original durable chunk result, including partial or all-invalid outcomes.
          headers:
            Cache-Control: { $ref: "#/components/headers/RecoveryCacheControl" }
            X-Operation-Id: { $ref: "#/components/headers/RecoveryOperationId" }
            Idempotency-Replayed:
              { $ref: "#/components/headers/RecoveryReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportRunChunkResponse" }
        "400": { $ref: "#/components/responses/RecoveryBadRequest" }
        "401": { $ref: "#/components/responses/RecoveryUnauthorized" }
        "403": { $ref: "#/components/responses/RecoveryForbidden" }
        "404": { $ref: "#/components/responses/RecoveryNotFound" }
        "409": { $ref: "#/components/responses/RecoveryConflict" }
  /invoice-import-runs/{id}/finalize:
    post:
      operationId: finalizeInvoiceImportRun
      tags: [operations]
      summary: Finalize a fully committed run and recover its aggregate result
      description: Requires every manifest chunk to be committed. Idempotent on repeat; never executes the invoice importer. Incomplete runs return 409.
      parameters:
        - $ref: "#/components/parameters/RecoveryId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRunFinalizeInput" }
      responses:
        "200": { $ref: "#/components/responses/ImportRunSuccess" }
        "400": { $ref: "#/components/responses/RecoveryBadRequest" }
        "401": { $ref: "#/components/responses/RecoveryUnauthorized" }
        "403": { $ref: "#/components/responses/RecoveryForbidden" }
        "404": { $ref: "#/components/responses/RecoveryNotFound" }
        "409": { $ref: "#/components/responses/RecoveryConflict" }
components:
  parameters:
    RecoveryId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OperationRequestKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: Persisted intent key, reused unchanged across retry/refresh. Parent attaches to POST /invoices; committed legacy imports require the same header, while previews do not.
      schema: { $ref: "#/components/schemas/OperationIdempotencyKey" }
  headers:
    RecoveryCacheControl:
      schema: { type: string, enum: ["private, no-store"] }
      description: Authenticated recovery records must not be cached.
    RecoveryOperationId:
      schema: { type: string, format: uuid }
      description: Stable server operation identifier.
    RecoveryReplayed:
      schema: { type: string, enum: ["true", "false"] }
      description: Whether the original committed result was replayed without executing again.
  responses:
    RecoveryBadRequest:
      description: Invalid query, manifest, row indexes, row count or request key. Error body uses the existing error message shape, not internal domain codes.
      headers:
        Cache-Control: { $ref: "#/components/headers/RecoveryCacheControl" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RecoveryUnauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RecoveryForbidden:
      description: Current capability or tenant/client authorization is missing.
      headers:
        Cache-Control: { $ref: "#/components/headers/RecoveryCacheControl" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RecoveryNotFound:
      description: Unknown, unfinished, or inaccessible record. No cross-client ownership information is disclosed.
      headers:
        Cache-Control: { $ref: "#/components/headers/RecoveryCacheControl" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RecoveryConflict:
      description: Existing intent key has a different payload, manifest/chunk hash changed, chunk is out of order, or run is incomplete. Preserve the original key when retrying an uncertain outcome.
      headers:
        Cache-Control: { $ref: "#/components/headers/RecoveryCacheControl" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ImportRunSuccess:
      description: Authorized run state and committed results.
      headers:
        Cache-Control: { $ref: "#/components/headers/RecoveryCacheControl" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ImportRunDetail" }
  schemas:
    ImportRunFinalizeInput:
      type: object
      additionalProperties: false
    OperationCommand:
      type: string
      enum: [invoice.create, invoice.import]
    OperationIdempotencyKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
    OperationState:
      type: string
      enum: [succeeded, partial, failed]
    OperationSummary:
      type: object
      required:
        [
          id,
          command,
          idempotencyKey,
          status,
          title,
          route,
          summary,
          startedAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        command: { $ref: "#/components/schemas/OperationCommand" }
        idempotencyKey: { $ref: "#/components/schemas/OperationIdempotencyKey" }
        status: { $ref: "#/components/schemas/OperationState" }
        title: { type: string }
        route:
          type: string
          maxLength: 48
          pattern: '^/(invoices|import(\?run=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?)$'
          description: Server-authorized navigation destination. A committed resumable chunk links to /import?run=<UUID> from its owned chunk/run reference; legacy imports link to /import.
        summary: { type: string }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OperationResult:
      type: object
      required: [statusCode, body]
      properties:
        statusCode: { type: integer, minimum: 200, maximum: 299 }
        body:
          description: Original saved JSON response. invoice.create returns InvoiceDetail; invoice.import returns InvoiceImportResult for a legacy import or ImportRunChunkResponse for a resumable chunk.
          anyOf:
            - $ref: "#/components/schemas/InvoiceDetail"
            - $ref: "#/components/schemas/InvoiceImportResult"
            - $ref: "#/components/schemas/ImportRunChunkResponse"
    OperationDetail:
      allOf:
        - $ref: "#/components/schemas/OperationSummary"
        - type: object
          required: [result]
          properties:
            result: { $ref: "#/components/schemas/OperationResult" }
    OperationList:
      type: object
      required: [operations, nextCursor]
      properties:
        operations:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/OperationSummary" }
        nextCursor:
          type: [string, "null"]
          maxLength: 256
    ImportRunManifest:
      type: object
      additionalProperties: false
      required: [id, clientPartyId, totalRows, chunkSize, chunkHashes]
      properties:
        id:
          type: string
          format: uuid
          description: Random client intent UUID, persisted before dispatch. Never derive only from file content.
        clientPartyId: { type: string, format: uuid }
        totalRows: { type: integer, minimum: 1, maximum: 5000 }
        chunkSize: { type: integer, minimum: 1, maximum: 250 }
        chunkHashes:
          type: array
          minItems: 1
          maxItems: 5000
          description: Exactly ceil(totalRows/chunkSize) ordered hashes. Hash the JSON rows array using recursively sorted object keys, preserved array order, omitted undefined properties, and UTF-8 SHA-256 lowercase hex. Rows are not trimmed or coerced.
          items: { type: string, pattern: "^[0-9a-f]{64}$" }
    ImportRunChunkInput:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 250
          description: Exact manifest range, with consecutive rowNumber values starting at chunkIndex*chunkSize+1. First data row is 1, excluding the spreadsheet header. Extra row fields are rejected. Expected length is min(chunkSize,totalRows-chunkIndex*chunkSize).
          items: { $ref: "#/components/schemas/InvoiceImportRow" }
    ImportRunChunkResponse:
      type: object
      required: [runId, chunkIndex, nextChunkIndex, result]
      properties:
        runId: { type: string, format: uuid }
        chunkIndex: { type: integer, minimum: 0, maximum: 4999 }
        nextChunkIndex: { type: integer, minimum: 1, maximum: 5000 }
        result: { $ref: "#/components/schemas/InvoiceImportResult" }
    ImportRunCommittedChunk:
      type: object
      required: [chunkIndex, operationId, rowCount, result]
      properties:
        chunkIndex: { type: integer, minimum: 0, maximum: 4999 }
        operationId: { type: string, format: uuid }
        rowCount: { type: integer, minimum: 1, maximum: 250 }
        result: { $ref: "#/components/schemas/InvoiceImportResult" }
    ImportRunDetail:
      type: object
      required:
        [
          id,
          clientPartyId,
          manifestHash,
          totalRows,
          chunkSize,
          chunkHashes,
          nextChunkIndex,
          status,
          committedRows,
          createdCount,
          invalidCount,
          createdAt,
          updatedAt,
          finalizedAt,
          chunks,
          result,
        ]
      properties:
        id: { type: string, format: uuid }
        clientPartyId: { type: string, format: uuid }
        manifestHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        totalRows: { type: integer, minimum: 1, maximum: 5000 }
        chunkSize: { type: integer, minimum: 1, maximum: 250 }
        chunkHashes:
          type: array
          minItems: 1
          maxItems: 5000
          items: { type: string, pattern: "^[0-9a-f]{64}$" }
        nextChunkIndex: { type: integer, minimum: 0, maximum: 5000 }
        status:
          type: string
          enum: [open, ready, completed]
          description: ready means every chunk is committed but finalize has not yet been recorded.
        committedRows:
          type: integer
          minimum: 0
          maximum: 5000
          description: Processed rows, including invalid rows with durable outcomes.
        createdCount: { type: integer, minimum: 0, maximum: 5000 }
        invalidCount: { type: integer, minimum: 0, maximum: 5000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finalizedAt: { type: [string, "null"], format: date-time }
        chunks:
          type: array
          maxItems: 5000
          items: { $ref: "#/components/schemas/ImportRunCommittedChunk" }
        result:
          description: Non-null only after finalization. Rows are sorted by original rowNumber.
          anyOf:
            - $ref: "#/components/schemas/InvoiceImportResult"
            - type: "null"
