packages:
  - artifacts/*
  - lib/*
  - scripts

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: 4.22.4
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^4.5.4

# Supply-chain gate ignores, each with a reason. image-size: metro (the Expo
# dev-time bundler) pins the v1 line and calls the package's callable default
# export. No patched release is currently published; forcing v2 would also
# break image bundling at `expo start`. The advisories are
# infinite-loop DoS in ICNS/JXL/HEIF parsers fed only by the app's own
# bundled assets, never untrusted input. Drop these when Expo/metro ship an
# image-size v2 bump.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

# pnpm >=10.26 and 11 share allowBuilds; v11 ignores onlyBuiltDependencies.
# Preserve the reviewed package allowlist. Unknown lifecycle scripts fail closed.
strictDepBuilds: true
verifyDepsBeforeRun: error
# Pin the documented pnpm 10/11 default so verification sees false, not unset.
enableGlobalVirtualStore: false

# Security floors are kept in package.json's pnpm.overrides so pnpm's
# install-state verification and lockfile metadata use the same source.

allowBuilds:
  '@swc/core': true
  esbuild: true
  msw: true
  unrs-resolver: true
