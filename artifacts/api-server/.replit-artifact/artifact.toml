kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["node", "scripts/src/ops/replit-promote.mjs", "build", "api-server", "--hold"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Verify the packaged CI bytes before loading the unchanged API bundle.
args = ["node", "--enable-source-maps", "scripts/src/ops/replit-promote.mjs", "start", "api-server", "--hold"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
# Production uses reviewed versioned migrations, never a dev-data overwrite.
# Do not set SEED_DEMO: production must never create known-password accounts.

[services.production.health.startup]
path = "/api/healthz"
