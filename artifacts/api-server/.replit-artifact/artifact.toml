kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Pilot profile (R105): verify the staged CI artifact; Replit Publish owns schema changes.
args = ["node", "scripts/src/ops/replit-promote.mjs", "build", "api-server"]

[services.production.build.env]
NODE_ENV = "production"
RELEASE_PROFILE = "pilot"

[services.production.run]
# Verify the packaged CI bytes before loading the unchanged API bundle.
args = ["node", "--enable-source-maps", "scripts/src/ops/replit-promote.mjs", "start", "api-server"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
RELEASE_PROFILE = "pilot"
# Replit's Publish diff owns production tables; boot re-applies the guardrail
# migrations (RLS, append-only triggers) before readiness. Never a dev-data
# overwrite. Do not set SEED_DEMO: production must never create
# known-password accounts.
# PUBLIC_APP_URL (deployment settings) is required: boot holds readiness until
# it names a safe https origin, because every link the platform sends is built
# on it and on nothing else (R112).

# Readiness, not liveness: /api/healthz answers 200 while the guardrail pass is
# still failing, so a rollout probed there would "succeed" and serve 503.
# /api/readyz turns 200 only once the guardrails verified and the database
# answers (R111).
[services.production.health.startup]
path = "/api/readyz"
