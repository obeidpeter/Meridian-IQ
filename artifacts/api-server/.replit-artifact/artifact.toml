kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["node", "scripts/src/ops/replit-promote.mjs", "build", "api-server"]

[services.production.build.env]
NODE_ENV = "production"
RELEASE_RUNTIME_STATE = "HOLD"
RELEASE_RECOVERY_MODE = "rollback"
RELEASE_ROLLBACK_REVISION = "ea275be456a2c19babd06139de10cdbe322bc049"

[services.production.run]
# Verify the packaged CI bytes before loading the unchanged API bundle.
args = ["node", "--enable-source-maps", "scripts/src/ops/replit-promote.mjs", "start", "api-server"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
RELEASE_RUNTIME_STATE = "HOLD"
RELEASE_RECOVERY_MODE = "rollback"
RELEASE_ROLLBACK_REVISION = "ea275be456a2c19babd06139de10cdbe322bc049"
# Production uses reviewed versioned migrations, never a dev-data overwrite.
# Do not set SEED_DEMO: production must never create known-password accounts.

[services.production.health.startup]
path = "/api/healthz"
