kind = "mobile"
previewPath = "/mobile/"
title = "MeridianIQ Mobile"
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
# Promote the CI-packaged native exports and server without rebuilding.
build = [ "node", "scripts/src/ops/replit-promote.mjs", "build", "mobile" ]
run = [ "node", "scripts/src/ops/replit-promote.mjs", "start", "mobile" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
