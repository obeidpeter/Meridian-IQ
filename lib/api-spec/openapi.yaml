          type: string
        issueDate:
          type: string
        dueDate:
          type: ["string", "null"]
        currency:
          type: string
        grandTotal:
          type: string
        # Derived from settlement evidence only — a bill's invoice status
        # never transitions: paid when a paid/statement event exists,
        # scheduled when the latest flag is scheduled, else open.
        payStatus:
          type: string
          enum: [open, scheduled, paid]
        lastVerification:
          type: ["object", "null"]
          required: [valid, checkedAt]
          properties:
            valid:
              type: boolean
            eligible:
              type: ["boolean", "null"]
            checkedAt:
              type: string
