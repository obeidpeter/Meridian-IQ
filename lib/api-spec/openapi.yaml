              type: ["string", "null"]
            oldestRaisedAt:
              type: ["string", "null"]
        stuckBatches:
          type: object
          required: [count, oldestQueuedAt]
          properties:
            count:
              type: integer
            oldestQueuedAt:
              type: ["string", "null"]
        unmappedCodeCases:
          type: integer
        clerkEnabled:
          type: boolean
        resistanceAlert:
          type: boolean
        # Extraction cases decided on the previous Lagos day.
        decidedYesterday:
          type: integer
        # Pre-submission invoices blocked on a colleague's approval across
        # every policy-on firm (maker-checker, platform-wide).
        approvalsPending:
          type: integer
        # Inbound collection-account payments of the past 7 days that bound
        # to no invoice, platform-wide.
        unmatchedCollections7d:
          type: integer
