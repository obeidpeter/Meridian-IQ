        category:
          type: string
        amount:
          type: string
        deductedDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        # How the deduction was recorded: an accepted short-pay
        # reconciliation match, or by hand.
        source:
          type: string
          enum: [statement_match, manual]
        status:
          type: string
          enum: [awaiting_note, note_received]
        noteReference:
          type: ["string", "null"]
        noteDate:
