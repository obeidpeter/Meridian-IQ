        amount:
          type: string
        deductedDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
    WhtNoteInput:
      type: object
      required: [noteReference, noteDate]
      properties:
        noteReference:
          type: string
          minLength: 1
          maxLength: 120
        noteDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
    WhtRemittanceRow:
      type: object
      required: [invoiceId, invoiceNumber, vendorName, category, baseAmount, whtAmount, issueDate]
      properties:
        invoiceId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        vendorName:
          type: string
        category:
          type: string
        baseAmount:
          type: string
        whtAmount:
          type: string
        issueDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
    WhtRemittance:
      type: object
      required: [period, periodLabel, dueDate, rows, totals]
      properties:
        period:
          type: string
          pattern: '^\d{4}-\d{2}$'
        periodLabel:
          type: string
        # The statutory remit-by date (the 21st of the following month,
        # from the shared statutory calendar).
        dueDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        rows:
          type: array
          items:
            $ref: "#/components/schemas/WhtRemittanceRow"
        totals:
          type: object
          required: [bills, whtAmount]
          properties:
            bills:
              type: integer
            whtAmount:
              type: string
    ClerkCaseDecisionInput:
      type: object
