      type: object
      required: [monthStart, monthLabel, months, rows, totals, note]
      properties:
        monthStart:
          type: string
        monthLabel:
          type: string
        months:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/FirmVatPositionRow"
        totals:
