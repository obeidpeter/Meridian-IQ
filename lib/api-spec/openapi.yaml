          minLength: 3
        title:
          type: string
          minLength: 3
        proposition:
          type: string
          minLength: 10
        protectedFacts:
          type: array
          items:
            $ref: "#/components/schemas/ProtectedFact"
        citation:
          type: string
          minLength: 3
        applicability:
          $ref: "#/components/schemas/ClaimApplicability"
        effectiveFrom:
          type: string
        effectiveTo:
          type: ["string", "null"]
        reviewDueAt:
          type: ["string", "null"]
    ClaimUpdateInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
        proposition:
          type: string
          minLength: 10
        protectedFacts:
          type: array
          items:
            $ref: "#/components/schemas/ProtectedFact"
        citation:
          type: string
          minLength: 3
        applicability:
          $ref: "#/components/schemas/ClaimApplicability"
        effectiveFrom:
          type: string
        effectiveTo:
          type: ["string", "null"]
        reviewDueAt:
          type: ["string", "null"]
    ClaimDecisionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject, suspend, resume]
        note:
          type: ["string", "null"]
    ClerkExtractionField:
      type: object
      required: [field, value, confidence, sourceSnippet, critical, flagged]
      properties:
        field:
          type: string
        value:
          type: ["string", "null"]
        confidence:
          type: number
        sourceSnippet:
          type: ["string", "null"]
        critical:
          type: boolean
        flagged:
          type: boolean
    ClerkExtractionLine:
      type: object
      required: [description, quantity, unitPrice, vatRate, confidence]
      properties:
        description:
          type: ["string", "null"]
        quantity:
          type: ["string", "null"]
        unitPrice:
          type: ["string", "null"]
        vatRate:
          type: ["string", "null"]
        confidence:
          type: number
    ClerkExtraction:
      type: object
      required: [fields, lines, promptVersion, model]
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ClerkExtractionField"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ClerkExtractionLine"
        # Supplier memory: the approved case whose fixture rode along as the
        # one-shot example (absent when extracted cold).
        exemplarCaseId:
          type: string
        promptVersion:
          type: string
        model:
          type: string
    ClerkCaseSourcePages:
      type: object
      required: [pages, purged]
      properties:
        # Base64 PNG pages in document order; empty when purged.
        pages:
          type: array
          items:
            type: string
        # True when the retention sweep has already cleared the content.
        purged:
          type: boolean
    ClerkFeedbackInput:
      type: object
      required: [helpful]
      properties:
        helpful:
          type: boolean
    AskFeedbackReport:
      type: object
      required: [totals, byIntent, recentNotHelpful]
      properties:
        totals:
          type: object
          required: [helpful, notHelpful, unrated]
          properties:
            helpful:
              type: integer
            notHelpful:
              type: integer
            unrated:
              type: integer
        byIntent:
          type: array
          items:
            type: object
            required: [intent, helpful, notHelpful]
            properties:
              # A data-intent key, "register" for claim answers, or "refused".
              intent:
                type: string
              helpful:
                type: integer
              notHelpful:
                type: integer
        recentNotHelpful:
          type: array
          items:
            type: object
            required: [caseId, question, createdAt]
            properties:
              caseId:
                type: string
              question:
                type: string
              createdAt:
                type: string
    MintFixtureInput:
      type: object
      required: [caseId]
      properties:
        caseId:
          type: string
        # Pseudonymize known party identities (names, TINs) in the stored
        # document text. Defaults true; the server refuses false for cases
        # still traceable to a live client.
        scrub:
          type: boolean
    ClerkAnswer:
      type: object
      required: [answered]
      properties:
        answered:
          type: boolean
        claimId:
          type: string
        claimKey:
          type: string
        claimVersion:
          type: integer
        # Set when the answer came from a platform-computed firm-record lookup
        # (idea #6) instead of a claims-register proposition.
        dataIntent:
          type: string
        # App-resolved lookup parameters for display (idea #4), e.g.
        # {month: "May 2026", client: "Adaeze Foods Ltd"}.
        dataParams:
          type: object
          additionalProperties:
            type: string
        proposition:
          type: string
        facts:
          type: array
          items:
            $ref: "#/components/schemas/ProtectedFact"
        citation:
          type: string
        refusalReason:
          type: string
        # Deterministic action links derived from the data-intent facts by the
        # app (never the model): each names a surface the asker may open.
        links:
          type: array
          items:
            $ref: "#/components/schemas/ClerkAnswerLink"
        # Ask 2.0: the ordered intents the planner executed (display titles,
        # app-resolved — never model text). Absent on single-intent and
        # register answers for backward compatibility.
        plan:
          type: array
          items:
            type: object
            required: [key, title]
            properties:
              key:
                type: string
              title:
                type: string
        # Ask 2.0: the scope this answer resolved to, BY ID, so a follow-up
        # (previousCaseId) re-pins the exact month/party rather than
        # re-matching display labels (two clients may share a legal name).
        # Server-validated against the asker's live offered context on every
        # follow-up — never trusted as-is.
        pins:
          type: object
          properties:
            monthStart:
              type: string
            monthLabel:
              type: string
            clientPartyId:
              type: string
            clientName:
              type: string
        # Ask 2.0: per-intent sections of a multi-part answer. When present,
        # the flat proposition is a short lead-in and the flat facts/links are
        # empty — renderers show the sections. Absent on single-intent
        # answers, whose flat fields render exactly as before.
        sections:
          type: array
          items:
            $ref: "#/components/schemas/AskAnswerSection"
    AskAnswerSection:
      type: object
      required: [title, text, facts]
      properties:
        title:
          type: string
        text:
          type: string
        dataIntent:
          type: string
        dataParams:
          type: object
          additionalProperties:
            type: string
        facts:
          type: array
          items:
            $ref: "#/components/schemas/ProtectedFact"
        links:
          type: array
          items:
            $ref: "#/components/schemas/ClerkAnswerLink"
        action:
          $ref: "#/components/schemas/AskSectionAction"
    AskSectionAction:
      description:
        Do with Clerk (round 31) — an action PROPOSAL assembled from an act.*
        plan step. Everything the approval surface needs to drive the
        existing execute route; nothing in an answer executes, and the
        execute route re-asserts capability, flag, consent and every target
        at approval time.
      type: object
      required:
        [kind, clientPartyId, clientName, why, targetCount, truncated, invoiceIds]
      properties:
        kind:
          type: string
          enum: [submit_overdue, retry_failed, draft_chasers]
        clientPartyId:
          type: string
          format: uuid
        clientName:
          type: string
        why:
          type: string
        targetCount:
          type: integer
        truncated:
          type: boolean
        invoiceIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    ClerkAnswerLink:
      type: object
      required: [label, kind]
      properties:
        label:
          type: string
        kind:
          type: string
          enum: [invoice]
        id:
          type: ["string", "null"]
    CreatePlanRunInput:
      description:
        Exactly one origin — an Ask case whose action sections are approved
        whole (caseId), or a deterministic template assembled for one client
        (templateKey + clientPartyId). The server re-reads and freezes the
        steps; nothing client-supplied reaches execution.
      type: object
      properties:
        caseId:
          type: string
          format: uuid
        templateKey:
          type: string
        clientPartyId:
          type: string
          format: uuid
    PlanRunStepView:
      type: object
      required:
        [kind, clientPartyId, clientName, targetCount, status, executedCount, failedCount, skippedCount]
      properties:
        kind:
          type: string
          enum: [submit_overdue, retry_failed, draft_chasers, draft_recurring, reconcile_matches]
        clientPartyId:
          type: string
          format: uuid
        clientName:
          type: string
        targetCount:
          type: integer
        status:
          type: string
          enum: [pending, executed, halted_here, skipped]
        decisionId:
          type: ["string", "null"]
        executedCount:
          type: integer
        failedCount:
          type: integer
        skippedCount:
          type: integer
        draftCount:
          type: integer
          description: Draft invoices a deterministic step created (0 for action steps).
    PlanRunView:
      type: object
      required: [id, status, steps, processedSteps, approvedBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        firmId:
          type: string
          format: uuid
        caseId:
          type: ["string", "null"]
        templateKey:
          type: ["string", "null"]
        status:
          type: string
          enum: [queued, running, done, halted, failed]
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PlanRunStepView"
        processedSteps:
          type: integer
        haltReason:
          type: ["string", "null"]
        approvedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PlanRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/PlanRunView"
    GrantPlanPolicyInput:
      type: object
      required: [templateKey]
      properties:
        templateKey:
          type: string
        clientPartyId:
          type: string
          format: uuid
          description: Required for firm principals; a client_user is pinned to its own party.
    ClerkPlanPolicy:
      type: object
      required:
        [id, firmId, clientPartyId, templateKey, grantedBy, grantedByRole, createdAt]
      properties:
        id:
          type: string
          format: uuid
        firmId:
          type: string
          format: uuid
        clientPartyId:
          type: string
          format: uuid
        templateKey:
          type: string
        grantedBy:
          type: string
          format: uuid
        grantedByRole:
          type: string
        pausedAt:
          type: ["string", "null"]
          format: date-time
        pausedReason:
          type: ["string", "null"]
          description: manual, or a tripwire — run_halted, grantor_inactive, engagement_closed, consent_missing, unknown_template, run_error.
        revokedAt:
          type: ["string", "null"]
          format: date-time
        lastRunMonth:
          type: ["string", "null"]
        lastRunId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    PlanPolicyList:
      type: object
      required: [policies, enabled]
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/ClerkPlanPolicy"
        enabled:
          type: boolean
    AutomationRollupPolicies:
      type: object
      required: [live, paused]
      properties:
        live:
          type: integer
        paused:
          type: object
          additionalProperties:
            type: integer
    AutomationRollup:
      type: object
      required: [actionPolicies, planPolicies, runs30d, decisions30d]
      properties:
        actionPolicies:
          $ref: "#/components/schemas/AutomationRollupPolicies"
        planPolicies:
          $ref: "#/components/schemas/AutomationRollupPolicies"
        runs30d:
          type: object
          required: [total, done, halted]
          properties:
            total:
              type: integer
            done:
              type: integer
            halted:
              type: integer
        decisions30d:
          type: object
          required: [total, auto, executed, failed]
          properties:
            total:
              type: integer
            auto:
              type: integer
            executed:
              type: integer
            failed:
              type: integer
    AutomationEvidenceKind:
      type: object
      required:
        [kind, sample, agreed, disagreed, pending, agreementRate, medianLeadDays, exposureFloorNgn, note]
      properties:
        kind:
          type: string
          enum: [reconcile_matches, submit_overdue, retry_failed, draft_recurring]
        # Decided historical cases in the window (agreed + disagreed);
        # pending is what the kind would act on right now.
        sample:
          type: integer
        agreed:
          type: integer
        disagreed:
          type: integer
        pending:
          type: integer
        agreementRate:
          type: ["number", "null"]
        medianLeadDays:
          type: ["number", "null"]
        # s.104 small-band floor (whole-naira string) — submit_overdue only.
        exposureFloorNgn:
          type: ["string", "null"]
        note:
          type: string
    AutomationEvidence:
      type: object
      required: [windowMonths, asOf, kinds]
      properties:
        windowMonths:
          type: integer
        asOf:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/AutomationEvidenceKind"
    ClerkCase:
      type: object
      required: [id, kind, status, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [extraction, question, notice]
        status:
          type: string
          enum: [pending, extracted, in_review, approved, rejected, escalated, failed]
        sourceType:
          type: ["string", "null"]
        sourceName:
          type: ["string", "null"]
        sourceText:
          type: ["string", "null"]
        sourceImageB64:
          type: ["string", "null"]
        sourceHash:
          type: ["string", "null"]
        sourceDurationSec:
          type: ["integer", "null"]
        # Per-firm fast-lane confidence threshold in force for this case,
        # derived deterministically from the firm's own calibration history
        # (floored; defaults to the global constant when history is thin).
        fastLaneThreshold:
          type: number
        # Asker's helpfulness signal on a question case (null = unrated).
        feedback:
          type: ["string", "null"]
          enum: [helpful, not_helpful, null]
        # Deterministic pre-flight issues computed at extraction time (empty =
        # clean; null = computed before this feature existed). "advisory"
        # issues inform the reviewer without blocking the fast lane.
        preflight:
          type: ["array", "null"]
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
              severity:
                type: string
                enum: [advisory]
        extraction:
          anyOf:
            - $ref: "#/components/schemas/ClerkExtraction"
            - type: "null"
        # Notice Desk (kind "notice" cases): the proposed notice reading.
        # Mutually exclusive with `extraction`.
        noticeExtraction:
          anyOf:
            - $ref: "#/components/schemas/ClerkNoticeExtraction"
            - type: "null"
        question:
          type: ["string", "null"]
        answer:
          anyOf:
            - $ref: "#/components/schemas/ClerkAnswer"
            - type: "null"
        firmId:
          type: ["string", "null"]
        # The async batch this case came out of (null for one-off captures) —
        # the review queue groups a bundle's segments together.
        batchId:
          type: ["string", "null"]
        claimedBy:
          type: ["string", "null"]
        claimedAt:
          type: ["string", "null"]
          format: date-time
        createdBy:
          type: string
        decidedBy:
          type: ["string", "null"]
        decisionAction:
          type: ["string", "null"]
        decisionReason:
          type: ["string", "null"]
        corrections:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClerkCorrection"
        createdInvoiceId:
          type: ["string", "null"]
        failReason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClerkCaseCreateInput:
      type: object
      required: [sourceType]
      properties:
        sourceType:
          type: string
          enum: [image, pdf, text, voice]
        # What the document IS (Notice Desk). Absent = invoice, the historic
        # behavior; "notice" routes the capture down the notice extraction
        # lane (kind "notice" case, obligation on approval, never an invoice).
        documentKind:
          type: string
          enum: [invoice, notice]
        name:
          type: string
        contentType:
          type: string
        imageBase64:
          type: string
        pdfBase64:
          type: string
        text:
          type: string
        audioBase64:
          type: string
        durationSec:
          type: integer
          minimum: 0
        allowDuplicate:
          type: boolean
    # Notice Desk: the proposed reading of a tax-authority notice (kind
    # "notice" cases). Field shape is shared with invoice extraction; there
    # are no lines, and noticeType is the model's pick from the closed
    # catalogue (a key, echoed as plain string so old rows outlive catalogue
    # growth).
    ClerkNoticeExtraction:
      type: object
      required: [fields, noticeType, promptVersion, model]
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ClerkExtractionField"
        noticeType:
          type: string
        promptVersion:
          type: string
        model:
          type: string
    NoticeDecisionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject, escalate]
        reason:
          type: string
        # Confirmed values (approve only; the server rejects an approve that
        # omits firmId, clientPartyId, noticeType, authority or
        # responseDueDate). The human's confirmation IS the data — the model's
        # proposal never writes an obligation.
        firmId:
          type: string
          format: uuid
        clientPartyId:
          type: string
          format: uuid
        noticeType:
          type: string
          enum: [assessment, demand, information_request, audit, penalty, reminder, other]
        authority:
          type: string
          enum: [firs, state_irs, customs, other]
        reference:
          type: string
        taxType:
          type: string
          enum: [vat, cit, wht, paye, stamp_duty, other]
        period:
          type: string
        amount:
          type: string
        currency:
          type: string
        issueDate:
          type: string
        responseDueDate:
          type: string
        notes:
          type: string
    NoticeDecisionResult:
      type: object
      required: [case]
      properties:
        case:
          $ref: "#/components/schemas/ClerkCase"
        # Present on approve only: the obligation the decision created.
        obligation:
          $ref: "#/components/schemas/Obligation"
    Obligation:
      type: object
      required:
        [
          id,
          firmId,
          clientPartyId,
          noticeType,
          authority,
          responseDueDate,
          status,
          createdBy,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        firmId:
          type: string
        clientPartyId:
          type: string
        # The notice case this was approved from; null when recorded by hand.
        sourceCaseId:
          type: ["string", "null"]
        # Catalogue keys echoed as plain strings so rows outlive catalogue
        # growth (write inputs pin the closed enums).
        noticeType:
          type: string
        authority:
          type: string
        reference:
          type: ["string", "null"]
        taxType:
          type: ["string", "null"]
        period:
          type: ["string", "null"]
        amount:
          type: ["string", "null"]
        currency:
