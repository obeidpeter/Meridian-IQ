      type: object
      required: [invoiceId, invoiceNumber, supplierPartyId, supplierName, issueDate, currency, grandTotal, payStatus]
      properties:
        invoiceId:
          type: string
        invoiceNumber:
          type: string
        supplierPartyId:
          type: string
