          type: string
        text:
          type: string
        pdfBase64:
          type: string
    ClerkBatchView:
      type: object
      required:
        [
          id,
          status,
          processedSegments,
          createdCases,
          skippedDuplicates,
          reviewedCases,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        firmId:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        # 'scan' when the bundle was a textless PDF processed via the vision
        # segmentation path (round-5 idea #1).
        kind:
          type: string
          enum: [text, scan]
        status:
          type: string
          enum: [queued, processing, done, failed]
        totalSegments:
          type: ["integer", "null"]
        processedSegments:
          type: integer
        createdCases:
          type: integer
        skippedDuplicates:
          type: integer
        # Of the batch's created cases, how many the operator has decided
        # (approved or rejected) — the review queue's per-bundle progress.
        reviewedCases:
          type: integer
        failReason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExtractionPromptInfo:
      type: object
      required: [promptVersion, system]
      properties:
        promptVersion:
          type: string
        system:
          type: string
    RunPromptCanaryInput:
      type: object
      required: [candidateSystem]
      properties:
        candidateSystem:
          type: string
          minLength: 100
          maxLength: 20000
    PromptCanarySide:
      type: object
      required:
        [
          promptVersion,
          fieldsCompared,
          fieldsCorrect,
          accuracy,
          injectionFixtures,
          injectionResisted,
          failures,
        ]
      properties:
        promptVersion:
          type: string
        fieldsCompared:
          type: integer
        fieldsCorrect:
          type: integer
        accuracy:
          type: ["number", "null"]
        injectionFixtures:
          type: integer
        injectionResisted:
          type: integer
        failures:
          type: integer
    PromptCanaryReport:
      type: object
      required:
        [fixtureCount, truncated, incumbent, candidate, fixtures, verdict, verdictReason]
      properties:
        fixtureCount:
          type: integer
        truncated:
          type: boolean
        incumbent:
          $ref: "#/components/schemas/PromptCanarySide"
        candidate:
          $ref: "#/components/schemas/PromptCanarySide"
        fixtures:
          type: array
          items:
            type: object
            required:
              [key, label, riskLabel, incumbentCorrect, candidateCorrect, fieldsCompared, regressed]
            properties:
              key:
                type: string
              label:
                type: string
              riskLabel:
                type: string
              incumbentCorrect:
                type: integer
              candidateCorrect:
                type: integer
              fieldsCompared:
                type: integer
              regressed:
                type: boolean
        # The deterministic verdict rule: injection resistance may never
        # drop; accuracy changes inside the noise band are comparable.
        verdict:
          type: string
          enum: [improvement, comparable, regression]
        verdictReason:
          type: string
    IntentEvalFixtureResult:
      type: object
      required:
        [key, label, riskLabel, outcome, classified, correct, resisted]
      properties:
        key:
          type: string
        label:
          type: string
        riskLabel:
          type: string
          enum: [clean, injection]
        outcome:
          type: string
          enum: [ok, invalid, error]
        classified:
          type: object
          nullable: true
          required: [claimKey, month, client]
          properties:
            claimKey:
              type: string
            month:
              type: string
            client:
              type: string
        correct:
          type: boolean
        resisted:
          type: boolean
          nullable: true
    IntentEvalReport:
      type: object
      required:
        [
          fixtureCount,
          correctCount,
          injectionFixtures,
          injectionResisted,
          results,
        ]
      properties:
        fixtureCount:
          type: integer
        correctCount:
          type: integer
        injectionFixtures:
          type: integer
        injectionResisted:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/IntentEvalFixtureResult"
    IntentEvalRun:
      type: object
      required:
        [
          id,
          model,
          promptVersion,
          fixtureCount,
          correctCount,
          injectionFixtures,
          injectionResisted,
          results,
          durationMs,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        model:
          type: string
        promptVersion:
          type: string
        fixtureCount:
          type: integer
        correctCount:
          type: integer
        injectionFixtures:
          type: integer
        injectionResisted:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/IntentEvalFixtureResult"
        durationMs:
          type: integer
        createdAt:
          type: string
          format: date-time
    RunIntentEvalInput:
      type: object
      properties:
        # When present, the corpus runs under this candidate system prompt
        # and the incumbent side by side; nothing is stored.
        candidateSystem:
          type: string
          maxLength: 20000
    IntentEvalOutcome:
      type: object
      required: [canary, run]
      properties:
        canary:
          nullable: true
          type: object
          required: [incumbent, candidate, verdict]
          properties:
            incumbent:
              allOf:
                - $ref: "#/components/schemas/IntentEvalReport"
                - type: object
                  required: [promptVersion]
                  properties:
                    promptVersion:
                      type: string
            candidate:
              $ref: "#/components/schemas/IntentEvalReport"
            # Deterministic: injection resistance may never drop; accuracy is
            # judged outside a one-fixture noise band.
            verdict:
              type: string
              enum: [promote, reject, inconclusive]
        run:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/IntentEvalRun"
    # Phrasing eval lane (round 18): digest/chaser synthetic fact packs
    # replayed through the byte-identical production prompt builders, scored
    # deterministically (grounding, required/forbidden content, injection
    # resistance).
    # Digest impact (round 20): consecutive weekly fact snapshots as the
    # time series; buckets under the pair floor show null rates.
    DigestImpactReport:
      type: object
      required: [delivered, undelivered, note]
      properties:
        delivered:
          $ref: "#/components/schemas/DigestImpactBucket"
        undelivered:
          $ref: "#/components/schemas/DigestImpactBucket"
        note:
          type: string
    DigestImpactBucket:
      type: object
      required: [pairs, meanUrgentDelta, improvedShare]
      properties:
        pairs:
          type: integer
        meanUrgentDelta:
          type: ["number", "null"]
        improvedShare:
          type: ["number", "null"]
    # Proposed actions (rounds 21-22): Clerk assembles, a human disposes.
    # The catalogue is closed and code-defined — submit_overdue,
    # retry_failed, and draft_chasers (drafting only; the client sends).
    ActionTarget:
      type: object
      required:
        [
          invoiceId,
          invoiceNumber,
          issueDate,
          daysOverdue,
          grandTotal,
          currency,
          note,
        ]
      properties:
        invoiceId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        issueDate:
          type: string
        daysOverdue:
          type: integer
        grandTotal:
          type: ["string", "null"]
        currency:
          type: string
        # Per-kind context line: the last rail error for retry_failed, the
        # buyer and expected date for draft_chasers, null for submit_overdue.
        note:
          type: ["string", "null"]
    ActionProposal:
      type: object
      required: [kind, title, why, targets, targetCount, truncated, evidence]
      properties:
        kind:
          type: string
          enum: [submit_overdue, retry_failed, draft_chasers]
        title:
          type: string
        why:
          type: string
        targets:
          type: array
          items:
            $ref: "#/components/schemas/ActionTarget"
        targetCount:
          type: integer
        truncated:
          type: boolean
        evidence:
          type: object
          additionalProperties: true
    ActionProposals:
      type: object
      required: [actions, note]
      properties:
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionProposal"
        note:
          type: string
    ExecuteActionInput:
      type: object
      required: [kind, invoiceIds]
      properties:
        kind:
          type: string
          enum: [submit_overdue, retry_failed, draft_chasers]
        # The submit kinds accept up to 50; a draft_chasers batch is capped
        # at 10 server-side (each target is a model call).
        invoiceIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        clientPartyId:
          type: string
          format: uuid
          description: Required for firm principals; a client_user is pinned to its own party.
    ActionTargetOutcome:
      type: object
      required: [invoiceId, invoiceNumber, outcome, error]
      properties:
        invoiceId:
          type: string
        invoiceNumber:
          type: string
        outcome:
          type: string
          # 'drafted' is the draft_chasers success: a reminder was written
          # for the human to send — nothing was submitted anywhere.
          enum: [submitted, invalid, skipped_not_eligible, failed, drafted]
        error:
          type: ["string", "null"]
    ClerkActionDecision:
      type: object
      required:
        [
          id,
          firmId,
          clientPartyId,
          kind,
          decidedBy,
          policyId,
          evidence,
          targets,
          requestedCount,
          executedCount,
          skippedCount,
          failedCount,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        firmId:
          type: string
          format: uuid
        clientPartyId:
          type: string
          format: uuid
        kind:
          type: string
        decidedBy:
          type: string
          format: uuid
        # Set when a standing approval (not a fresh human click) authorized
        # this run — decidedBy then names the policy's grantor.
        policyId:
          type: ["string", "null"]
          format: uuid
        evidence:
          type: object
          additionalProperties: true
        targets:
          type: array
          items:
            $ref: "#/components/schemas/ActionTargetOutcome"
        requestedCount:
          type: integer
        executedCount:
          type: integer
        skippedCount:
          type: integer
        failedCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    ExecuteActionResult:
      type: object
      required: [decision, drafts]
      properties:
        decision:
          $ref: "#/components/schemas/ClerkActionDecision"
        # draft_chasers only: the drafted reminders, shown once for the
        # human to copy and send — no draft is stored (model-phrased output
        # is retained in the inference ledger like every Clerk call). Null
        # for the submit kinds.
        drafts:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/PaymentChaserDraft"
    ActionDecisionList:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/ClerkActionDecision"
    ClerkActionPolicy:
      type: object
      required:
        [
          id,
          firmId,
          clientPartyId,
          kind,
          maxTargetsPerRun,
          grantedBy,
          grantedByRole,
          pausedAt,
          pausedReason,
          pausedBy,
          revokedAt,
          revokedBy,
          lastRunAt,
          lastRunDay,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        firmId:
          type: string
          format: uuid
        clientPartyId:
          type: string
          format: uuid
        kind:
          type: string
        maxTargetsPerRun:
          type: integer
        grantedBy:
          type: string
          format: uuid
        grantedByRole:
          type: string
        pausedAt:
          type: ["string", "null"]
          format: date-time
        # "manual" for a human pause; the sweep's tripwires write
        # grantor_inactive | consent_missing | failed_targets | unknown_kind |
        # rail_rejections | engagement_closed | run_error.
        pausedReason:
          type: ["string", "null"]
        # Null when a sweep tripwire paused it (pausedReason says why).
        pausedBy:
          type: ["string", "null"]
          format: uuid
        revokedAt:
          type: ["string", "null"]
          format: date-time
        revokedBy:
          type: ["string", "null"]
          format: uuid
        lastRunAt:
          type: ["string", "null"]
          format: date-time
        # Lagos YYYY-MM-DD of the last claimed run.
        lastRunDay:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    ActionPolicyList:
      type: object
      required: [policies, enabled]
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/ClerkActionPolicy"
        # Whether the clerk_action_policies flag is live for this firm — the
        # grant AFFORDANCE gate only. Grants deliberately stay listed while
        # dark, so they remain visible, pausable and revocable even when the
        # engine that would run them is off.
        enabled:
          type: boolean
    GrantActionPolicyInput:
      type: object
      required: [kind]
      properties:
        # The automatable subset of the action catalogue: draft_chasers is
        # excluded by design — its output exists only on the response for a
        # human to read, which an unattended sweep cannot do.
        kind:
          type: string
          enum: [submit_overdue, retry_failed]
        clientPartyId:
          type: string
          format: uuid
          description: Required for firm principals; a client_user is pinned to its own party.
        # Per-run target cap; defaults to the batch maximum (50).
        maxTargetsPerRun:
          type: integer
          minimum: 1
          maximum: 50
    ActionEffectivenessKindRow:
      type: object
      required:
        [
          kind,
          decisions,
          autoDecisions,
          requested,
          executed,
          skipped,
          failed,
          nowSucceeded,
          nowInFlight,
          nowFailedAgain,
          nowOther,
        ]
      properties:
        kind:
          type: string
        decisions:
          type: integer
        # Of which ran under a standing approval (policyId set).
        autoDecisions:
          type: integer
        requested:
          type: integer
        executed:
          type: integer
        skipped:
          type: integer
        failed:
          type: integer
        # Current invoice status of the EXECUTED submit targets, re-read at
        # request time. Null for draft_chasers — drafted text has no rail
        # lifecycle to verify (reminder effectiveness audits chasing).
        nowSucceeded:
          type: ["integer", "null"]
        nowInFlight:
          type: ["integer", "null"]
        # Failed AFTER the batch reported success — the number a reader must
        # never lose.
        nowFailedAgain:
          type: ["integer", "null"]
        nowOther:
          type: ["integer", "null"]
    ActionEffectivenessReport:
      type: object
      required: [windowDays, totals, exposureFloorClearedNgn, kinds]
      properties:
        windowDays:
          type: integer
        totals:
          type: object
          required: [decisions, autoDecisions, executed, failed]
          properties:
            decisions:
              type: integer
            autoDecisions:
              type: integer
            executed:
              type: integer
            failed:
              type: integer
        # Lowest-band s.104 exposure estimate removed by the window's
        # executed submit_overdue targets STILL STANDING on the rails
        # (failed-again targets are subtracted — their exposure is back),
        # whole naira ("0" when none) — an estimate under the published
        # penalty model, not advice.
        exposureFloorClearedNgn:
          type: string
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/ActionEffectivenessKindRow"
    PhrasingEvalFixtureResult:
