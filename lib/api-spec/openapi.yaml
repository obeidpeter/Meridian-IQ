        claimKey:
          type: string
        version:
          type: integer
        state:
          type: string
          enum: [draft, review, active, suspended, superseded, expired, rejected]
        title:
          type: string
        proposition:
          type: string
        protectedFacts:
          type: array
          items:
            $ref: "#/components/schemas/ProtectedFact"
        citation:
          type: string
        applicability:
          $ref: "#/components/schemas/ClaimApplicability"
        effectiveFrom:
          type: string
        effectiveTo:
          type: ["string", "null"]
        reviewDueAt:
          type: ["string", "null"]
        createdBy:
          type: string
        submittedBy:
          type: ["string", "null"]
        decidedBy:
          type: ["string", "null"]
        decisionNote:
          type: ["string", "null"]
        supersededById:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClaimDraftInput:
      type: object
