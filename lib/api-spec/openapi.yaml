          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationEvidence"
  # Phase 2 (round 37): the SAME backtest narrowed to one client, for the
  # grant dialogs — the action-effectiveness posture (invoice.read + the
  # client analytics resolver), NOT the firm-wide portfolio wall above.
  /clerk/client-automation-evidence:
