  # Prove with Clerk Phase 1 (round 36): the backtest evidence behind the
  # dark automation flags — recorded-ledger agreement between what each
  # automation kind would have done and what humans later did. Pure SQL +
  # pure replay over durable facts; zero model calls; nothing stored.
  /clerk/automation-evidence:
    get:
      operationId: getAutomationEvidence
