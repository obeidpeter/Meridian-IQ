        [clientPartyId, clientName, outputVat, inputVat, inputVatVerified, netVat, defensibleNetVat]
      properties:
        clientPartyId:
          type: string
          format: uuid
        clientName:
          type: string
        outputVat:
          type: string
        inputVat:
          type: string
        inputVatVerified:
          type: string
        netVat:
          type: string
        defensibleNetVat:
          type: string
    FirmPolicies:
      type: object
      required: [submitApprovalRequired]
