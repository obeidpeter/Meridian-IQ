        firmId:
          type: string
        clientPartyId:
          type: string
        connectorKey:
          type: string
        cursor:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, paused, error]
        lastSyncAt:
          type: ["string", "null"]
          format: date-time
        lastError:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErpConnectionInput:
