  # Filing Desk Phase 1 (round 38): the statutory returns register — one row
  # per client x tax type x period, minted deterministically from the
  # statutory calendar (VAT due the 21st of the following month, PAYE the
  # 10th). Evidence-only posture: the platform records that a return was
  # prepared and filed (date + acknowledgment reference); it never files
  # anything itself. Rows are minted by the sweep or the sync endpoint,
  # never created by hand — the register's completeness IS its value.
  /filings:
    get:
      operationId: listFilings
      summary: The firm's statutory returns register (client-scoped for client users)
      tags: [filings]
      parameters:
        - name: clientPartyId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [upcoming, prepared, filed]
        - name: taxType
          in: query
          required: false
          schema:
            type: string
            enum: [vat, paye, wht]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Returns register rows, soonest due first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilingList"
        "400":
          $ref: "#/components/responses/BadRequest"
  /filings/sync:
    post:
      operationId: syncFilings
      summary: Mint the current period's return rows for this firm now (idempotent)
      tags: [filings]
      responses:
        "200":
          description: How many rows this call minted (0 when already current)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncFilingsResult"
  /filings/{id}/status:
    post:
      operationId: updateFilingStatus
      summary: Walk a return forward (prepared, then filed with its evidence)
      tags: [filings]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFilingStatusInput"
      responses:
        "200":
          description: The updated register row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Filing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
