    OperatorBrief:
      type: object
      required:
        [
          asOf,
          openCases,
          unansweredEscalations,
          stuckBatches,
          unmappedCodeCases,
          clerkEnabled,
          resistanceAlert,
          decidedYesterday,
          spendAlerts,
          approvalsPending,
          unmatchedCollections7d,
        ]
      properties:
        # Firms whose latest-day Clerk spend is anomalously above their own
