      type: object
      required: [invoiceId, irn, csid, valid, checkedAt]
      properties:
        invoiceId:
          type: string
        irn:
          type: string
        csid:
          type: string
        valid:
          type: boolean
        # Null when the stamp is unknown to this platform (validity comes
        # from the rail record; eligibility needs the invoice lifecycle).
        eligible:
          type: ["boolean", "null"]
        checkedAt:
          type: string
    PayablesSummary:
      type: object
      required: [clientPartyId, groups, topSuppliers]
      properties:
        clientPartyId:
          type: string
        groups:
          type: array
          items:
            type: object
            required: [currency, overdue, dueWeeks, later, total]
            properties:
              currency:
                type: string
              # Bills whose due date has passed with no payment evidence.
              overdue:
                $ref: "#/components/schemas/CashflowBucket"
              # Four consecutive 7-day due buckets starting today.
              dueWeeks:
                type: array
                items:
                  type: object
                  required: [startDate, amount, count]
                  properties:
                    startDate:
                      type: string
                    amount:
                      type: string
                    count:
                      type: integer
              later:
                $ref: "#/components/schemas/CashflowBucket"
              total:
                $ref: "#/components/schemas/CashflowBucket"
        topSuppliers:
          type: array
          items:
            type: object
            required: [supplierPartyId, supplierName, amount, count]
            properties:
              supplierPartyId:
                type: string
              supplierName:
                type: string
              amount:
                type: string
              count:
                type: integer
