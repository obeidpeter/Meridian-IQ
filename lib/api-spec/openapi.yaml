          type: integer
    CashflowBucket:
      type: object
      required: [amount, count]
      properties:
        amount:
          type: string
        count:
          type: integer
    CashflowOutlook:
      type: object
      required: [asOf, groups]
      properties:
        asOf:
          type: string
        groups:
          type: array
          items:
            type: object
            required: [currency, overdueExpected, weeks, later, total]
            properties:
              currency:
                type: string
              # Money already past its expected date — late, not future inflow.
              overdueExpected:
                $ref: "#/components/schemas/CashflowBucket"
              # Consecutive 7-day buckets starting today.
              weeks:
                type: array
                items:
                  type: object
                  required: [startDate, amount, count]
                  properties:
                    startDate:
                      type: string
                    amount:
                      type: string
                    count:
                      type: integer
              later:
                $ref: "#/components/schemas/CashflowBucket"
              total:
                $ref: "#/components/schemas/CashflowBucket"
    NetCashPosition:
      type: object
      required: [asOf, groups, note]
      properties:
        asOf:
          type: string
        groups:
          type: array
          items:
            type: object
            required:
              [
                currency,
                overdueInflow,
                overdueOutflow,
                weeks,
                laterInflow,
                laterOutflow,
                squeezeWeeks,
              ]
            properties:
              currency:
                type: string
              # Already-late money on both sides sits OUTSIDE the weekly nets.
              overdueInflow:
                $ref: "#/components/schemas/CashflowBucket"
              overdueOutflow:
                $ref: "#/components/schemas/CashflowBucket"
              weeks:
                type: array
                items:
                  type: object
                  required:
                    [
                      startDate,
                      inflow,
                      inflowCount,
                      outflow,
                      outflowCount,
                      net,
                      squeeze,
                    ]
                  properties:
                    startDate:
                      type: string
                    inflow:
                      type: string
                    inflowCount:
                      type: integer
                    outflow:
                      type: string
                    outflowCount:
                      type: integer
                    net:
                      type: string
                    # Committed outflows exceed projected inflows this week.
                    squeeze:
                      type: boolean
              laterInflow:
                $ref: "#/components/schemas/CashflowBucket"
              laterOutflow:
                $ref: "#/components/schemas/CashflowBucket"
              squeezeWeeks:
                type: integer
        note:
          type: string
