            [
              consent_captured,
              history_imported,
              statements_backfilled,
              duplicates_reviewed,
              filings_synced,
            ]
        # "done" and "skipped" both settle a step; the difference is the
        # record — done is detected from facts, skipped carries the firm's
        # reason (the gap the readiness report will name).
        status:
          type: string
          enum: [pending, done, skipped]
        # Step-specific detection facts (counts, month coverage, duplicate
        # suggestions) — shaped per step, deliberately open.
        evidence:
          type: object
          additionalProperties: true
        gaps:
          type: array
          items:
            type: string
        skippedReason:
          type: ["string", "null"]
        checkedAt:
          type: ["string", "null"]
