        # When true, submitting any invoice for stamping requires a live
        # approval recorded by a different principal (maker-checker).
        submitApprovalRequired:
          type: boolean
    UpdateFirmPoliciesInput:
      type: object
      required: [submitApprovalRequired]
      properties:
        submitApprovalRequired:
          type: boolean
    InvoiceApproval:
      type: object
      required: [id, invoiceId, approvedByUserId, approvedByName, note, revokedAt, createdAt]
      properties:
        id:
          type: string
        invoiceId:
          type: string
        approvedByUserId:
          type: string
        approvedByName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        # Set when the invoice's content changed after approval — a revoked
        # approval no longer satisfies the submission policy.
        revokedAt:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    ApproveInvoiceInput:
      type: object
      properties:
        note:
          type: string
          maxLength: 1000
    CollectionAccount:
      type: object
      required: [id, clientPartyId, provider, accountReference, label, active, createdAt]
      properties:
        id:
          type: string
        clientPartyId:
          type: string
        provider:
          type: string
        accountReference:
          type: string
        label:
          type: ["string", "null"]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CreateCollectionAccountInput:
      type: object
      required: [clientPartyId]
      properties:
        clientPartyId:
          type: string
        label:
          type: string
          maxLength: 200
    # Unmatched inbound collections (round 17): per-account counts of live
    # payments that bound to no invoice, read back from the webhook's
    # pointer-only audit events. Amounts are never recorded for unmatched
    # payments — the note says to reconcile against the provider statement.
    UnmatchedCollections:
      type: object
      required: [windowDays, total, accounts, note]
      properties:
        windowDays:
          type: integer
        total:
          type: integer
        accounts:
          type: array
          items:
            type: object
            required:
              [
                accountId,
                accountReference,
                label,
                clientPartyId,
                clientName,
                count,
                firstSeen,
                lastSeen,
              ]
            properties:
              accountId:
                type: string
              accountReference:
                type: string
              label:
                type: ["string", "null"]
              clientPartyId:
                type: string
              clientName:
                type: string
              count:
                type: integer
              firstSeen:
                type: string
              lastSeen:
                type: string
        note:
          type: string
    CompliancePackNotifyInput:
      type: object
      required: [clientPartyId]
      properties:
        clientPartyId:
          type: string
        month:
          type: string
          pattern: '^\d{4}-\d{2}-01$'
    VatPack:
      type: object
      required: [monthStart, monthLabel, months, rows, totals, note]
      properties:
        monthStart:
          type: string
        monthLabel:
          type: string
        # The closed Lagos months a pack may be requested for (newest first).
        months:
          type: array
          items:
            type: string
        # Issue-month basis, rails-accepted documents only, credit notes
        # netted, cancelled excluded — see `note` for the full disclosure.
        rows:
          type: array
          items:
            type: object
            required:
              [
                clientPartyId,
                clientName,
                acceptedCount,
                acceptedTotal,
                acceptedVat,
                creditCount,
                creditVat,
                netVat,
              ]
            properties:
              clientPartyId:
                type: string
                format: uuid
              clientName:
                type: string
              acceptedCount:
                type: integer
              acceptedTotal:
                type: string
              acceptedVat:
                type: string
              creditCount:
                type: integer
              creditVat:
                type: string
              netVat:
                type: string
        totals:
          type: object
          required:
            [acceptedCount, acceptedTotal, acceptedVat, creditCount, creditVat, netVat]
          properties:
            acceptedCount:
              type: integer
            acceptedTotal:
              type: string
            acceptedVat:
              type: string
            creditCount:
              type: integer
            creditVat:
              type: string
            netVat:
              type: string
        note:
          type: string
    DraftVatCoverNoteInput:
      type: object
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}-01$'
    VatSettlementCheck:
      type: object
      required:
        [
          monthStart,
          monthLabel,
          months,
          acceptedCount,
          acceptedTotal,
          settledCount,
          settledTotal,
          outstandingCount,
          outstandingTotal,
          creditedCount,
          creditedTotal,
          otherCount,
          otherTotal,
          settledShare,
          unsettled,
          unsettledTruncated,
          note,
        ]
      properties:
        monthStart:
          type: string
        monthLabel:
          type: string
        months:
          type: array
          items:
            type: string
        # The pack month's accepted invoices (the VAT pack's population,
        # invoices only) split by what settlement the platform has OBSERVED.
        acceptedCount:
          type: integer
        acceptedTotal:
          type: string
        settledCount:
          type: integer
        settledTotal:
          type: string
        outstandingCount:
          type: integer
        outstandingTotal:
          type: string
        creditedCount:
          type: integer
        creditedTotal:
          type: string
        # Partition guard: accepted invoices in a lifecycle state outside the
        # three buckets (unreachable through normal flows) — surfaced, never
        # silently absorbed into the share's denominator.
        otherCount:
          type: integer
        otherTotal:
          type: string
        # settledTotal / acceptedTotal (4dp); null when the month had no
        # value or mixes currencies (a share of unlike units is not a number).
        settledShare:
          type: number
          nullable: true
        unsettled:
          type: array
          items:
            type: object
            required:
              [
                invoiceId,
                invoiceNumber,
                clientName,
                buyerName,
                issueDate,
                dueDate,
                currency,
                grandTotal,
                status,
              ]
            properties:
              invoiceId:
                type: string
                format: uuid
              invoiceNumber:
                type: string
              clientName:
                type: string
              buyerName:
                type: string
              issueDate:
                type: string
              dueDate:
                type: string
                nullable: true
              currency:
                type: string
              grandTotal:
                type: string
              status:
                type: string
        unsettledTruncated:
          type: boolean
        # Assurance-not-accusation disclosure — travels with every render.
        note:
          type: string
    VatPosition:
      type: object
      required:
        [
          monthStart,
          monthLabel,
          months,
          outputVat,
          outputNetVat,
          billCount,
          billVat,
          verifiedCount,
          verifiedVat,
          unverifiedCount,
          unverifiedVat,
          netPosition,
          unverified,
          unverifiedTruncated,
          note,
        ]
      properties:
        monthStart:
          type: string
        monthLabel:
          type: string
        months:
          type: array
          items:
            type: string
        # Output side — the monthly VAT pack's totals verbatim.
        outputVat:
          type: string
        outputNetVat:
          type: string
        # Input side — the firm's captured supplier bills issued in the month.
        billCount:
          type: integer
        billVat:
          type: string
        # Verified = the bill's NEWEST stamp verification says valid; only
        # verified input VAT counts toward the position.
        verifiedCount:
          type: integer
        verifiedVat:
          type: string
        unverifiedCount:
          type: integer
        unverifiedVat:
          type: string
        # The filing number: output net VAT minus verified input VAT.
        netPosition:
          type: string
        # The CTA — largest unverified input VAT first (capped).
        unverified:
          type: array
          items:
            type: object
            required:
              [
                invoiceId,
                invoiceNumber,
                clientName,
                supplierName,
                issueDate,
                currency,
                vatTotal,
              ]
            properties:
              invoiceId:
                type: string
                format: uuid
              invoiceNumber:
                type: string
              clientName:
                type: string
              supplierName:
                type: string
              issueDate:
                type: string
              currency:
                type: string
              vatTotal:
                type: string
        unverifiedTruncated:
          type: boolean
        note:
          type: string
    QuarterlyReview:
      type: object
      required:
        [
          quarterStart,
          quarterLabel,
          quarters,
          months,
          vatTotals,
          submissions,
          topRejections,
          rejectionTotal,
          receivables,
          clerk,
          note,
        ]
      properties:
        quarterStart:
          type: string
        quarterLabel:
          type: string
        # The closed Lagos quarters on offer (newest first, first-month keys).
        quarters:
          type: array
          items:
            type: string
        # Per month: the monthly VAT pack's totals, unchanged.
        months:
          type: array
          items:
            type: object
            required:
              [monthStart, monthLabel, acceptedCount, acceptedVat, creditVat, netVat]
            properties:
              monthStart:
                type: string
              monthLabel:
                type: string
              acceptedCount:
                type: integer
              acceptedVat:
                type: string
              creditVat:
                type: string
              netVat:
                type: string
        vatTotals:
          type: object
          required: [acceptedCount, creditCount, acceptedVat, creditVat, netVat]
          properties:
            acceptedCount:
              type: integer
            creditCount:
              type: integer
            acceptedVat:
              type: string
            creditVat:
              type: string
            netVat:
              type: string
        submissions:
          type: object
          required: [accepted, rejected]
          properties:
            accepted:
              type: integer
            rejected:
              type: integer
        # Top rejection codes (capped); rejectionTotal comes from the same
        # SQL pass so the quarter total stays honest beyond the cap.
        topRejections:
          type: array
          items:
            type: object
            required: [errorCode, category, count]
            properties:
              errorCode:
                type: string
              category:
                type: string
                nullable: true
              count:
                type: integer
        rejectionTotal:
          type: integer
        # As-of-generation snapshot, per currency — a balance has no quarter.
        receivables:
          type: object
          required: [asOf, groups]
          properties:
            asOf:
              type: string
            groups:
              type: array
              items:
                type: object
                required: [currency, outstandingTotal, invoiceCount]
                properties:
                  currency:
                    type: string
                  outstandingTotal:
                    type: string
                  invoiceCount:
                    type: integer
        clerk:
          type: object
          required: [captures, approved, rejected]
          properties:
            captures:
              type: integer
            approved:
              type: integer
            rejected:
              type: integer
        note:
          type: string
    DraftQuarterlyNoteInput:
      type: object
      properties:
        quarter:
          type: string
          pattern: '^\d{4}-\d{2}-01$'
    QuarterlyReviewCoverNote:
      type: object
      required: [quarterStart, quarterLabel, note, source, disclosure]
      properties:
        quarterStart:
          type: string
        quarterLabel:
          type: string
        # The drafted text — the partner edits and owns it; nothing is stored.
        note:
          type: string
        source:
          type: string
          enum: [clerk, template]
        # The pack's basis note, so the caveats travel with the text.
        disclosure:
          type: string
    CatalogueCoverageReport:
      type: object
      required:
        [
          windowDays,
          slaWindowDays,
          codedRejections,
          mappedAttempts,
          mappedShare,
          uncodedRejections,
          distinctCodes,
          mappedCodes,
          openUnmapped,
          unmappedTruncated,
          sla,
          recentMappings,
        ]
      properties:
        windowDays:
          type: integer
        slaWindowDays:
          type: integer
        # CODED rejected attempts in the window (uncoded rejections sit in
        # their own bucket — they can never be mapped), and how many carry a
        # code the catalogue maps TODAY (current-state coverage).
        codedRejections:
          type: integer
        mappedAttempts:
          type: integer
        mappedShare:
          type: number
          nullable: true
        uncodedRejections:
          type: integer
        distinctCodes:
          type: integer
        mappedCodes:
          type: integer
        # Currently-unmapped codes, oldest mapping debt first.
        openUnmapped:
          type: array
          items:
            type: object
            required: [code, occurrences, firstSeen, lastSeen, openCase]
            properties:
              code:
                type: string
              occurrences:
                type: integer
              firstSeen:
                type: string
              lastSeen:
                type: string
              openCase:
                type: boolean
        unmappedTruncated:
          type: boolean
        # INT-02 SLA over entries created in the SLA window that were SEEN
        # before being mapped; proactive entries are counted, never judged.
        sla:
          type: object
          required:
            [judged, avgDaysToMap, maxDaysToMap, withinOneDayShare, proactive]
          properties:
            judged:
              type: integer
            avgDaysToMap:
              type: number
              nullable: true
            maxDaysToMap:
              type: number
              nullable: true
            withinOneDayShare:
              type: number
              nullable: true
            proactive:
              type: integer
        recentMappings:
          type: array
          items:
            type: object
            required: [code, firstSeen, mappedAt, daysToMap]
            properties:
              code:
                type: string
              firstSeen:
                type: string
              mappedAt:
                type: string
              daysToMap:
                type: number
    VatPackCoverNote:
      type: object
      required: [monthStart, monthLabel, note, source, disclosure]
      properties:
        monthStart:
          type: string
        monthLabel:
          type: string
        # The drafted text — the partner edits and owns it; nothing is stored.
        note:
          type: string
        source:
          type: string
          enum: [clerk, template]
        # The pack's basis note, so the caveats travel with the text.
        disclosure:
          type: string
    LineItemSuggestion:
      type: object
      required: [key, description, count, medianUnitPrice, vatRate, lastUsed]
      properties:
        # Normalized item identity (order/case/punctuation-insensitive).
        key:
          type: string
        # The most recently used literal description.
        description:
          type: string
        count:
          type: integer
        medianUnitPrice:
          type: string
        vatRate:
          type: string
        lastUsed:
          type: string
    BuyerPaymentBehaviour:
      type: object
