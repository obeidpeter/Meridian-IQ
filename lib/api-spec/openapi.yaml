    # ---- R2 schemas: statements & reconciliation (INT-05, SME-07) ----
    BankStatement:
      type: object
      required: [id, firmId, clientPartyId, formatKey, status, lineCount, parsedCount, createdAt, updatedAt]
      properties:
        id:
          type: string
        firmId:
          type: string
        clientPartyId:
          type: string
        formatKey:
          type: string
        filename:
          type: ["string", "null"]
        accountRef:
          type: ["string", "null"]
        uploadedByUserId:
          type: ["string", "null"]
        status:
          type: string
          enum: [validated, committed, reconciled]
        lineCount:
          type: integer
        parsedCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BankStatementLine:
      type: object
      required: [id, statementId, lineNo, parseStatus, rawLine, createdAt]
      properties:
        id:
          type: string
        statementId:
          type: string
        lineNo:
          type: integer
        valueDate:
          type: ["string", "null"]
        amount:
          type: ["string", "null"]
        direction:
          type: ["string", "null"]
          enum: [credit, debit, null]
        narration:
          type: ["string", "null"]
        counterpartyRef:
          type: ["string", "null"]
        parseStatus:
          type: string
          enum: [parsed, invalid]
        parseError:
          type: ["string", "null"]
        rawLine:
          type: string
        # Clerk's narration reading for this line (advisory only; absent until
        # the firm asks Clerk to read the statement's narrations). proposalId
        # null = Clerk read the narration and abstained.
        narrationSuggestion:
          anyOf:
            - type: object
              required: [proposalId, cue, at]
              properties:
                proposalId:
                  type: ["string", "null"]
                invoiceId:
                  type: ["string", "null"]
                cue:
                  type: ["string", "null"]
                at:
                  type: string
            - type: "null"
        createdAt:
          type: string
          format: date-time
    StatementImportInput:
      type: object
      required: [clientPartyId, commit]
      properties:
        clientPartyId:
          type: string
        # Exactly one of csv | pdfBase64 (server-enforced). A PDF statement is
        # rasterized and its lines PROPOSED by vision extraction — the preview
        # (commit:false) is the human check before anything commits.
        csv:
          type: string
          minLength: 1
        pdfBase64:
          type: string
          minLength: 1
        formatKey:
          type: string
        filename:
          type: string
        commit:
          type: boolean
    StatementRowResult:
      type: object
      required: [lineNo, parseStatus]
      properties:
        lineNo:
          type: integer
        parseStatus:
          type: string
          enum: [parsed, invalid]
        valueDate:
          type: ["string", "null"]
        amount:
          type: ["string", "null"]
        direction:
          type: ["string", "null"]
          enum: [credit, debit, null]
        narration:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
    StatementImportResult:
      type: object
      required: [statementId, committed, formatKey, lineCount, parsedCount, parseRate, rows]
      properties:
        statementId:
          type: ["string", "null"]
        committed:
          type: boolean
        # PDF previews only: the deterministic CSV rendering of the model's
        # proposed lines. Commit by POSTing this back as `csv` — the rows the
        # user checked are exactly the rows that commit; a PDF with
        # commit:true is refused so extraction can never silently re-run.
        proposedCsv:
          type: ["string", "null"]
        formatKey:
          type: ["string", "null"]
        accountRef:
          type: ["string", "null"]
        lineCount:
          type: integer
        parsedCount:
          type: integer
        parseRate:
          type: number
        rows:
          type: array
          items:
            $ref: "#/components/schemas/StatementRowResult"
    MatchProposalView:
      type: object
      required: [id, statementId, statementLineId, invoiceId, invoiceNumber, invoiceStatus, invoiceTotal, buyerName, confidence, status, createdAt]
      properties:
        id:
          type: string
        statementId:
          type: string
        statementLineId:
          type: string
        invoiceId:
          type: string
        invoiceNumber:
          type: string
        invoiceStatus:
          type: string
        invoiceTotal:
          type: string
        buyerName:
          type: string
        lineNo:
          type: integer
        lineAmount:
          type: ["string", "null"]
        lineDate:
          type: ["string", "null"]
        narration:
          type: ["string", "null"]
        confidence:
          type: string
        features:
          type: ["object", "null"]
          additionalProperties: true
        status:
          type: string
          enum: [proposed, accepted, rejected, superseded]
        createdAt:
          type: string
          format: date-time
    MatchDecisionResult:
      type: object
      required: [proposalId, status, invoiceId, invoiceStatus, settlementEventId]
      properties:
        proposalId:
          type: string
        status:
          type: string
          enum: [accepted, rejected]
        invoiceId:
          type: string
        invoiceStatus:
          type: string
        settlementEventId:
          type: ["string", "null"]

