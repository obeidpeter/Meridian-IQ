        buyerName:
          type: ["string", "null"]
        buyerTin:
          type: ["string", "null"]
        invoiceNumber:
          type: ["string", "null"]
        issueDate:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        currency:
          type: ["string", "null"]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceDraftLine"
    InvoiceDraftResult:
      type: object
      required: [proposal, buyerSuggestions, model, promptVersion]
