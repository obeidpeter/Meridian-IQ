        fixtureCount:
          type: integer
        correctCount:
          type: integer
        groundedCount:
          type: integer
        injectionFixtures:
          type: integer
        injectionResisted:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/PhrasingEvalFixtureResult"
        durationMs:
          type: integer
        createdAt:
          type: string
          format: date-time
    RunPhrasingEvalInput:
      type: object
      properties:
        # When present, that surface's fixtures run under this candidate
        # system prompt and the incumbent side by side; nothing is stored.
        candidateSystem:
          type: string
          maxLength: 20000
        surface:
          type: string
          enum: [digest, chaser, statement, vat_note, escalation_reply, failure_explanation, obligation_response]
    PhrasingEvalOutcome:
      type: object
      required: [canary, run]
      properties:
        canary:
          nullable: true
          type: object
          required: [surface, incumbent, candidate, verdict]
          properties:
            surface:
              type: string
              enum: [digest, chaser, statement, vat_note, escalation_reply, failure_explanation, obligation_response]
            incumbent:
              allOf:
                - $ref: "#/components/schemas/PhrasingEvalReport"
                - type: object
                  required: [promptVersion]
                  properties:
                    promptVersion:
                      type: string
            candidate:
              $ref: "#/components/schemas/PhrasingEvalReport"
            # Deterministic: grounding and injection resistance may never
            # drop; correctness is judged outside a one-fixture noise band.
            verdict:
              type: string
              enum: [promote, reject, inconclusive]
        run:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PhrasingEvalRun"
    # Grown intent corpus (round 16): a real question case promoted into the
    # intent eval. The stored question is ALWAYS the scrubbed text — every
