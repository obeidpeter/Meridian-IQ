        windowDays:
          type: integer
        totalRejections:
          type: integer
        previousTotal:
          type: integer
        rows:
          type: array
          items:
            type: object
            required:
              [errorCode, count, invoiceCount, clientCount, previousCount, lastSeen]
            properties:
              errorCode:
                type: string
              category:
                type: ["string", "null"]
              cause:
                type: ["string", "null"]
              fix:
                type: ["string", "null"]
              retriable:
                type: ["boolean", "null"]
              count:
                type: integer
              invoiceCount:
                type: integer
              clientCount:
                type: integer
              previousCount:
                type: integer
              lastSeen:
                type: string
