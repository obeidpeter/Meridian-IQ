components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    KeyParam:
      name: key
      in: path
      required: true
      schema:
        type: string
    CodeParam:
      name: code
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        contractVersion:
          type: string
      required:
        - status
        - contractVersion
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Me:
      type: object
      required: [userId, role, capabilities]
      properties:
        userId:
          type: string
        role:
          type: string
        # Display identity for signed-in UI. Null for principals that do not
        # resolve to a users row (e.g. dev-header principals).
        email:
          type: ["string", "null"]
        fullName:
          type: ["string", "null"]
        firmId:
          type: ["string", "null"]
        clientPartyId:
          type: ["string", "null"]
        buyerPartyId:
          type: ["string", "null"]
        capabilities:
          type: array
          items:
            type: string
        # Bearer session token, returned ONLY by /auth/login for native mobile
        # clients that cannot rely on the HttpOnly cookie (Expo). Same signed
        # token as the cookie; sent as `Authorization: Bearer <token>`.
        token:
          type: ["string", "null"]
        # TOTP two-factor: when the account has TOTP enabled, /auth/login does
        # NOT set the session cookie; it returns mfaRequired=true plus a
        # short-lived signed mfaToken to redeem at /auth/totp/challenge.
        mfaRequired:
          type: boolean
        mfaToken:
          type: ["string", "null"]
    TotpChallengeInput:
      type: object
      required: [mfaToken, code]
      properties:
        mfaToken:
          type: string
        # A 6-digit TOTP code, or a one-time recovery code.
        code:
          type: string
          minLength: 6
          maxLength: 32
    TotpStatus:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        enabledAt:
          type: ["string", "null"]
        recoveryCodesRemaining:
          type: ["integer", "null"]
    TotpSetup:
      type: object
      required: [secret, otpauthUri, recoveryCodes]
      properties:
        # Base32 secret for manual entry; shown once, never retrievable again.
        secret:
          type: string
        otpauthUri:
          type: string
        recoveryCodes:
          type: array
          items:
            type: string
    TotpActivateInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 8
    TotpDisableInput:
      type: object
      required: [password, code]
      properties:
        password:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 6
          maxLength: 32
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 1
          maxLength: 256
    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
        newPassword:
          type: string
          minLength: 8
          maxLength: 256

    Invitation:
      type: object
      required: [id, email, role, firmId, status, expiresAt, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [firm_admin, firm_staff, client_user]
        firmId:
          type: string
        clientPartyId:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, accepted, revoked]
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateInvitationInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [firm_admin, firm_staff, client_user]
        # Operators name the firm the invite targets (new-firm bootstrap: create
        # the firm, then invite its first firm_admin). Firm principals always
        # invite into their own firm and must omit or match this field.
        firmId:
          type: string
        # Required when role is client_user (the client Party the invitee scopes to).
        clientPartyId:
          type: string
    InvitationWithToken:
      type: object
      required: [invitation, token]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        # The raw redemption token — shown ONCE. Share the accept link
        # /accept-invite?token=<token> with the invitee; only its hash is stored.
        token:
          type: string
    AcceptInvitationInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
