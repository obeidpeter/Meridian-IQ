          required: [awaitingNote, noteReceived, awaitingAmount, totalAmount]
          properties:
            awaitingNote:
              type: integer
            noteReceived:
              type: integer
            # Naira sums as decimal strings (the money-column convention).
            awaitingAmount:
              type: string
            totalAmount:
              type: string
    WhtCreditCreateInput:
      type: object
      required: [invoiceId, deductedDate]
      properties:
        invoiceId:
          type: string
          format: uuid
        # Omitted = the computed expectation (subtotal × the category's
