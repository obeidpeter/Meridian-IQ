          type: array
          items:
            $ref: "#/components/schemas/OnboardingRun"
    CreateOnboardingRunInput:
      type: object
      required: [clientPartyId]
      properties:
        clientPartyId:
          type: string
          format: uuid
    SkipOnboardingStepInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    # The day-one opening position (Onboard with Clerk Phase 2): every
    # section $refs the schema its owning module already speaks, so the
    # baseline can never disagree with the dashboards it summarizes.
    # STORED DURABLY: completed onboarding runs freeze this whole object
    # (including the $ref'd ClientVatPosition / ReceivablesSummary /
    # PayablesSummary / AutomationEvidence shapes) as jsonb — changes to
    # any of those schemas must stay ADDITIVE-OPTIONAL or old snapshots
    # stop parsing; the route degrades such snapshots to a live
    # provisional recompute rather than 500ing, but the frozen baseline
    # is then effectively lost.
    OpeningPosition:
      type: object
      required:
        [
          computedAt,
          provisional,
          history,
          receivables,
          payables,
          vat,
          filings,
          wht,
          obligations,
          automation,
        ]
      properties:
        computedAt:
          type: string
          format: date-time
        # True while the run is still active: history is still landing, so
        # the numbers are a moving picture, not the frozen baseline.
        provisional:
          type: boolean
        history:
          type: object
          required: [invoiceCount, earliestIssueDate, latestIssueDate]
          properties:
            invoiceCount:
              type: integer
            earliestIssueDate:
              type: ["string", "null"]
              pattern: '^\d{4}-\d{2}-\d{2}$'
            latestIssueDate:
              type: ["string", "null"]
              pattern: '^\d{4}-\d{2}-\d{2}$'
        receivables:
          $ref: "#/components/schemas/ReceivablesSummary"
        payables:
          $ref: "#/components/schemas/PayablesSummary"
        vat:
          $ref: "#/components/schemas/ClientVatPosition"
        filings:
          type: object
          required: [unfiled, dueSoon, overdue, nextDueDate]
          properties:
            unfiled:
              type: integer
            dueSoon:
              type: integer
            overdue:
              type: integer
            nextDueDate:
              type: ["string", "null"]
              pattern: '^\d{4}-\d{2}-\d{2}$'
        wht:
          type: object
          required: [awaiting, awaitingAmount]
          properties:
            awaiting:
              type: integer
            awaitingAmount:
              type: string
        obligations:
          type: object
          required: [open, dueSoon, overdue, nearestDue]
          properties:
            open:
              type: integer
            dueSoon:
              type: integer
            overdue:
              type: integer
            nearestDue:
              type: ["string", "null"]
              pattern: '^\d{4}-\d{2}-\d{2}$'
        automation:
          $ref: "#/components/schemas/AutomationEvidence"
    FilingMatrixRow:
      type: object
      required: [clientPartyId, clientName, vat, paye, wht]
      properties:
        clientPartyId:
          type: string
          format: uuid
        clientName:
          type: string
        # Status per kind; null = no row minted for this client/period yet
        # (a client onboarded after the mint — the sync button's case).
        vat:
          type: ["string", "null"]
          enum: [upcoming, prepared, filed, null]
        paye:
          type: ["string", "null"]
          enum: [upcoming, prepared, filed, null]
        # WHT remittances are minted only for clients that actually
        # withheld in the period, so null is the COMMON cell here (no
        # withholding duty), not just the late-onboarding case.
        wht:
          type: ["string", "null"]
          enum: [upcoming, prepared, filed, null]
    FilingMatrix:
      type: object
      required: [period, periodLabel, dueDates, rows, totals]
      properties:
        period:
          type: string
          pattern: '^\d{4}-\d{2}$'
        periodLabel:
          type: string
        dueDates:
          type: object
          required: [vat, paye, wht]
          properties:
            vat:
              type: string
              pattern: '^\d{4}-\d{2}-\d{2}$'
            paye:
              type: string
              pattern: '^\d{4}-\d{2}-\d{2}$'
            wht:
              type: string
              pattern: '^\d{4}-\d{2}-\d{2}$'
        rows:
          type: array
          items:
            $ref: "#/components/schemas/FilingMatrixRow"
        totals:
          type: object
          required: [clients, filed, unfiled, overdue]
          properties:
            clients:
              type: integer
            # Filed/unfiled count FILINGS (rows x kinds), not clients;
            # overdue counts unfiled filings past their statutory date.
            filed:
              type: integer
            unfiled:
              type: integer
            overdue:
              type: integer
    WhtCredit:
      type: object
      required:
        [id, firmId, clientPartyId, invoiceId, invoiceNumber, category, amount, deductedDate, source, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        firmId:
          type: string
          format: uuid
        clientPartyId:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        # Catalogue key echoed as plain text (the filings taxType rule);
