        correctCount:
          type: integer
        groundedCount:
          type: integer
        injectionFixtures:
          type: integer
        injectionResisted:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/PhrasingEvalFixtureResult"
    PhrasingEvalRun:
      type: object
