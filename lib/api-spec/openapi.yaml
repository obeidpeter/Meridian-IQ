            properties:
              lineId:
                type: string
                format: uuid
              statementId:
                type: string
                format: uuid
              valueDate:
                type: string
              amount:
                type: string
              narration:
                type: string
                nullable: true
              counterpartyRef:
                type: string
                nullable: true
        truncated:
          type: boolean
        # The advisory framing — money can arrive without an invoice for many
        # legitimate reasons; this is a prompt to check, never an accusation.
        note:
          type: string
    ProjectionAccuracy:
      type: object
      required:
        [
          asOf,
          withinDays,
          settlements,
          medianErrorDays,
          medianAbsErrorDays,
          withinShare,
          basisSplit,
          buyers,
          note,
        ]
      properties:
        asOf:
          type: string
        withinDays:
          type: integer
        settlements:
          type: integer
        # Signed: positive = money arrived LATER than projected. Nulls when
        # no settlements have been observed.
        medianErrorDays:
          type: number
          nullable: true
        medianAbsErrorDays:
          type: number
          nullable: true
        withinShare:
          type: number
          nullable: true
        # Which tier of the projection rule predicted each settlement.
        basisSplit:
          type: object
          required: [rhythm, dueDate, defaultTerms]
          properties:
            rhythm:
              type: integer
            dueDate:
              type: integer
            defaultTerms:
              type: integer
        buyers:
          type: array
          items:
            type: object
            required:
              [
                buyerPartyId,
                buyerName,
                settlements,
                medianErrorDays,
                medianAbsErrorDays,
                withinShare,
              ]
            properties:
              buyerPartyId:
                type: string
                format: uuid
              buyerName:
                type: string
              settlements:
                type: integer
              medianErrorDays:
                type: number
              medianAbsErrorDays:
                type: number
              withinShare:
                type: number
        note:
          type: string
    # Reminder effectiveness (round 16): the chase ladder joined to observed
    # settlements. Correlation only — the note says so — and the within-window
    # share counts only MATURE reminders (window fully elapsed or settled).
    ChaseEffectiveness:
      type: object
      required:
        [
          asOf,
          withinDays,
          remindedCount,
          remindedSettledCount,
          settledWithinShare,
          medianDaysReminderToSettle,
          medianDaysToSettleReminded,
          medianDaysToSettleUnreminded,
          note,
        ]
      properties:
        asOf:
          type: string
        withinDays:
          type: integer
        remindedCount:
          type: integer
        # Settled AFTER the first reminder — an earlier settlement never
        # credits the reminder.
        remindedSettledCount:
          type: integer
        settledWithinShare:
          type: number
          nullable: true
        medianDaysReminderToSettle:
          type: number
          nullable: true
        medianDaysToSettleReminded:
          type: number
          nullable: true
        medianDaysToSettleUnreminded:
          type: number
          nullable: true
        note:
          type: string
    # Penalty exposure (round 18): the public s.104 model pointed at the
    # caller's overdue paper — all three turnover bands (the platform does
    # not hold turnover), single-figure surfaces use the small-band floor.
    PenaltyExposure:
      type: object
      required:
        [asOf, overdueCount, exposure, perInvoice, sampleInvoices, note]
      properties:
        asOf:
          type: string
        overdueCount:
          type: integer
        exposure:
          type: object
          required: [small, medium, large]
          properties:
            small:
              type: string
            medium:
              type: string
            large:
              type: string
        perInvoice:
          type: object
          required: [small, medium, large]
          properties:
            small:
              type: string
            medium:
              type: string
            large:
              type: string
        sampleInvoices:
          type: array
          items:
            type: object
            required: [invoiceId, invoiceNumber, issueDate, daysOverdue]
            properties:
              invoiceId:
                type: string
                format: uuid
              invoiceNumber:
                type: string
              issueDate:
                type: string
              daysOverdue:
                type: integer
        note:
          type: string
    # Missing recurring bills (round 18): the payables mirror of unbilled
    # income — a vendor with a monthly capture habit and nothing captured
    # this cycle.
    MissingRecurringBill:
      type: object
      required:
        [
          supplierPartyId,
          supplierName,
          currency,
          count,
          medianAmount,
          medianGapDays,
          lastIssueDate,
          expectedByDate,
          overdueDays,
        ]
      properties:
        supplierPartyId:
          type: string
          format: uuid
        supplierName:
          type: string
        currency:
          type: string
        count:
          type: integer
        medianAmount:
          type: string
        medianGapDays:
          type: integer
        lastIssueDate:
          type: string
        expectedByDate:
          type: string
        overdueDays:
          type: integer
    # Month-end close (round 19): the deterministic advisories composed into
    # one checklist — each line computed by the same check that powers its
    # own card.
    MonthEndClose:
      type: object
      required: [asOf, items, attentionCount, note]
      properties:
        asOf:
          type: string
        items:
          type: array
          items:
            type: object
            required: [key, label, status, count, detail]
            properties:
              key:
                type: string
              label:
                type: string
              status:
                type: string
                enum: [clear, attention]
              count:
                type: integer
              detail:
                type: string
        attentionCount:
          type: integer
        note:
          type: string
    # Client compliance scorecard (round 19): cross-client posture league
    # table — pure SQL, sample floors, posture not blame.
    ComplianceScorecard:
      type: object
      required: [asOf, windowDays, rows, note]
      properties:
        asOf:
          type: string
        windowDays:
          type: integer
        rows:
          type: array
          items:
            type: object
            required:
              [
                clientPartyId,
                clientName,
                issuedCount,
                acceptedCount,
                withinWindowRate,
                failureRate,
                prevWithinWindowRate,
                prevFailureRate,
                medianDaysToStamp,
                overdueNow,
                unverifiedBills,
              ]
            properties:
              clientPartyId:
                type: string
                format: uuid
              clientName:
                type: string
              issuedCount:
                type: integer
              acceptedCount:
                type: integer
              withinWindowRate:
                type: ["number", "null"]
              failureRate:
                type: ["number", "null"]
              # The same rates over the window before — the trend baseline.
              prevWithinWindowRate:
                type: ["number", "null"]
              prevFailureRate:
                type: ["number", "null"]
              medianDaysToStamp:
                type: ["number", "null"]
              overdueNow:
                type: integer
              unverifiedBills:
                type: integer
        note:
          type: string
    # Double-payment guard (round 16): advisory only — evidence the platform
    # already holds, a human decides.
    DoublePaymentCheck:
      type: object
      required: [multiPaid, duplicateCandidates, note]
      properties:
        # Bills matched to two or more distinct bank-statement debits whose
        # amounts sum to more than the bill (installments never flag).
        multiPaid:
          type: array
          items:
            type: object
            required:
              [
                invoiceId,
                invoiceNumber,
                supplierName,
                currency,
                grandTotal,
                evidenceCount,
                firstPaidAt,
                lastPaidAt,
              ]
            properties:
              invoiceId:
                type: string
                format: uuid
              invoiceNumber:
                type: string
              supplierName:
                type: string
              currency:
                type: string
              grandTotal:
                type: string
              evidenceCount:
                type: integer
              firstPaidAt:
                type: string
              lastPaidAt:
                type: string
        # Same-supplier same-amount bill pairs issued within the
        # near-duplicate window where the second side is still unpaid —
        # including a paid original next to its unpaid copy.
        duplicateCandidates:
          type: array
          items:
            type: object
            required:
              [
                supplierName,
                currency,
                grandTotal,
                pairKind,
                first,
                second,
                daysApart,
              ]
            properties:
              supplierName:
                type: string
              currency:
                type: string
              grandTotal:
                type: string
              # paid_original: `first` is already paid, `second` is the
              # unpaid copy. both_unpaid: neither has payment evidence.
              pairKind:
                type: string
                enum: [both_unpaid, paid_original]
              first:
                $ref: "#/components/schemas/DuplicateBillRef"
              second:
                $ref: "#/components/schemas/DuplicateBillRef"
              daysApart:
                type: integer
        note:
          type: string
    DuplicateBillRef:
      type: object
      required: [invoiceId, invoiceNumber, issueDate]
      properties:
        invoiceId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        issueDate:
          type: string
    ClerkTierReport:
      type: object
      required: [windowDays, totalTokens, baseModel, rows]
      properties:
        windowDays:
          type: integer
        totalTokens:
          type: integer
        baseModel:
          type: string
        rows:
          type: array
          items:
            type: object
            required:
              [
                purpose,
                calls,
                totalTokens,
                spendShare,
                okCount,
                invalidCount,
                errorCount,
                killedCount,
                validRate,
                currentModel,
                tiered,
                recommendation,
                reason,
              ]
            properties:
              purpose:
                type: string
              calls:
                type: integer
              totalTokens:
                type: integer
              spendShare:
                type: number
              okCount:
                type: integer
              invalidCount:
                type: integer
              errorCount:
                type: integer
              # Kill-switch rejections — excluded from validRate's denominator.
              killedCount:
                type: integer
              validRate:
                type: number
              currentModel:
                type: string
              tiered:
                type: boolean
              recommendation:
                type: string
                enum: [candidate, keep, tiered, revert, insufficient_data]
              reason:
                type: string

    ClerkUsage:
      type: object
      required: [monthStart, usedTokens, budgetTokens, projectedTokens, paceBand, byPurpose]
      properties:
        monthStart:
          type: string
          format: date-time
        usedTokens:
          type: integer
        budgetTokens:
          type: integer
        # Budget pace (idea #7): month-end projection at the current burn rate
        # and its band, computed over the SAME UTC month boundary the 429
        # enforcement uses. "warning" = 80% used or projected past the
        # allowance (after a quarter of the month); "critical" = spent.
        projectedTokens:
          type: integer
        paceBand:
          type: string
          enum: [ok, warning, critical]
        # Spend transparency: month-to-date tokens split by ledger purpose,
        # largest first, so a firm nearing its cap can see WHICH Clerk
        # feature is consuming the allowance.
        byPurpose:
          type: array
          items:
            type: object
            required: [purpose, tokens]
            properties:
              purpose:
                type: string
              tokens:
                type: integer

    ClerkEvalRun:
      type: object
      required:
        [
          id,
          startedBy,
          model,
          promptVersion,
          fixtureCount,
          fieldsCompared,
          fieldsCorrect,
          accuracy,
          injectionFixtures,
          injectionResisted,
          results,
          durationMs,
          createdAt,
        ]
      properties:
        id:
          type: string
        startedBy:
          type: ["string", "null"]
        model:
          type: string
        promptVersion:
          type: string
        fixtureCount:
          type: integer
        fieldsCompared:
          type: integer
        fieldsCorrect:
          type: integer
        accuracy:
          type: ["number", "null"]
        injectionFixtures:
          type: integer
        injectionResisted:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/ClerkEvalFixtureResult"
        durationMs:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreatePaymentIntentInput:
      type: object
      required: [monthStart]
      properties:
        # First day of the billing month being paid, e.g. 2026-07-01.
        monthStart:
          type: string
          pattern: '^\d{4}-\d{2}-01$'
    PaymentIntent:
      type: object
      required: [id, monthStart, amountNgn, status, providerRef, checkoutUrl, createdAt, confirmedAt]
      properties:
        id:
          type: string
        monthStart:
          type: string
          pattern: '^\d{4}-\d{2}-01$'
        # Decimal string (kobo-precise), never a float.
        amountNgn:
          type: string
        status:
          type: string
          enum: [pending, confirmed, failed, cancelled]
        providerRef:
          type: ["string", "null"]
        checkoutUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        confirmedAt:
          type: ["string", "null"]
          format: date-time
    CreateFirmApiKeyInput:
      type: object
      required: [name, capabilities]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        capabilities:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
    FirmApiKey:
      type: object
      required: [id, name, capabilities, keyPrefix, lastUsedAt, revokedAt, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        capabilities:
          type: array
          items:
            type: string
        # Non-secret identifying prefix of the key, for display and support.
        keyPrefix:
          type: string
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
        revokedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    FirmApiKeyCreated:
      type: object
      required: [id, name, capabilities, keyPrefix, secret, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        capabilities:
          type: array
          items:
            type: string
        keyPrefix:
          type: string
        # The raw API key secret — shown ONCE at creation; only its hash is stored.
        secret:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateFirmWebhookInput:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 500
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
    FirmWebhook:
      type: object
      required: [id, url, events, active, secretPrefix, createdAt]
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        # Non-secret identifying prefix of the signing secret, for display.
        secretPrefix:
          type: string
        createdAt:
          type: string
          format: date-time
    FirmWebhookCreated:
      type: object
      required: [id, url, events, active, secretPrefix, secret, createdAt]
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        secretPrefix:
          type: string
        # The raw signing secret — shown ONCE at creation; only its hash is stored.
        secret:
          type: string
        createdAt:
          type: string
          format: date-time
    FirmWebhookDelivery:
      type: object
      required: [id, eventType, status, attempts, lastError, createdAt, deliveredAt]
      properties:
        id:
          type: string
        eventType:
          type: string
        status:
          type: string
          enum: [pending, delivered, failed, dead]
        attempts:
          type: integer
        lastError:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: ["string", "null"]
          format: date-time
    MarkNotificationsReadInput:
      type: object
      required: [upToCreatedAt]
      properties:
        # ISO timestamp; every feed item at or before it is marked read for the caller.
        upToCreatedAt:
          type: string
          format: date-time
