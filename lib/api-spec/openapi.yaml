      properties:
        buyerPartyId:
          type: string
          format: uuid
        buyerName:
          type: string
        # Accepted reconciliation matches behind the median (3+ required).
        settledCount:
          type: integer
        # Median days from invoice issue to the matched statement credit.
        medianDaysToPay:
          type: integer
        lastSettledDate:
