    ClientVatPosition:
      type: object
      required:
        [
          clientPartyId,
          monthStart,
          monthLabel,
          months,
          outputVat,
          outputInvoiceCount,
          inputVat,
          inputVatVerified,
          inputVatUnverified,
          billCount,
          netVat,
          defensibleNetVat,
          excludedForFx,
          note,
        ]
      properties:
        clientPartyId:
          type: string
        monthStart:
          type: string
        monthLabel:
          type: string
        # Requestable Lagos months, newest first — the current month is
        # included (a live position), unlike the closed-month VAT pack.
        months:
          type: array
          items:
            type: string
        # All amounts are NGN: non-NGN documents convert via their captured
        # fxRateToNgn; documents without a rate are excluded and counted in
        # excludedForFx (see note).
        outputVat:
          type: string
        outputInvoiceCount:
          type: integer
        inputVat:
          type: string
        # Input VAT on bills whose newest stamp verification found the stamp
        # on the national record (valid = true).
        inputVatVerified:
          type: string
        inputVatUnverified:
          type: string
        billCount:
          type: integer
        netVat:
          type: string
        # outputVat minus verified input VAT only — the position defensible
        # under an input-VAT audit today.
        defensibleNetVat:
          type: string
        excludedForFx:
          type: integer
        note:
          type: string
